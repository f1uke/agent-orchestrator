name: Frontend

# Runs the renderer vitest suite. This suite was silently dead for months
# because no workflow executed it (vitest only auto-loads vite.config.ts /
# vitest.config.ts, and the repo had neither until #171) — this job is the
# guard against that happening again.
#
# Typecheck is not run here: it lives in typecheck.yml, which runs on every
# pull request rather than only the frontend-touching ones this workflow is
# filtered to. The forge.config.ts / update-electron-app errors that used to
# block it are fixed.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Run vitest suite
        run: npx vitest run

  # Browser-rendered assertions that jsdom structurally cannot make: the status
  # glyph gutter shipped with `no_signal` drawing a zero-length path in the corner
  # of its viewBox — a ~1px speck on screen — while every jsdom test stayed green,
  # because the <svg> was present, sized, coloured and labelled. Only a real
  # browser's getBBox() can tell "draws a shape" from "draws nothing".
  #
  # The sidebar qa pip is here for the same reason and not a second one: whether an
  # indicator MOVES the row it sits on, and whether its two states differ in
  # SILHOUETTE rather than only in hue, are both questions about layout and paint
  # that jsdom answers by having neither.
  #
  # e2e/editor.spec.ts is here for the third time the same reason applies. The
  # Monaco file editor's two real failure modes are a minimap `// MARK:` band whose
  # label got middle-truncated in canvas pixels, and a band that vanished because
  # the token under it stopped reading as a comment. Both leave the DOM, the
  # decorations and the console exactly as they are when it works.
  #
  # e2e/editor-save.spec.ts is the fourth: editing, saving and resolving a write
  # conflict all depend on Monaco really holding a buffer — typing into its edit
  # context, an edit reaching the model, a mode switch swapping one editor for
  # another over the SAME model. jsdom has no Monaco, so the unit tests stub it and
  # can only check the contract the chrome hands it. This spec is only runnable at
  # all because the file viewer gained a VITE_NO_ELECTRON branch: before that this
  # surface rendered a header and then nothing under `dev:web`.
  #
  # e2e/files-perf.spec.ts is the fifth, and the clearest case of all: it counts
  # the DOM the Files rail builds for a workspace the size of a real iOS app. The
  # rail shipped rendering every one of ~8,500 rows — 91,295 nodes, 568 ms to
  # paint, 292 ms of blocked main thread per keystroke — and jsdom cannot tell a
  # windowed tree from a whole one, because it renders both to the same markup and
  # neither to a screen. It asserts node COUNTS, never timings, so it is a real
  # regression guard rather than a flake on a shared runner.
  #
  # e2e/files-state.spec.ts rides alongside it, for the one piece of the rail's
  # remembered arrangement jsdom cannot be asked about at all: SCROLL. There is no
  # layout there, so the tree's scroller measures zero, `scrollTop` never moves,
  # and a restore that quietly does nothing passes every unit test. It also pins
  # the collapsed-by-default row count and re-checks that a RESTORED scroll still
  # renders a window rather than everything above it.
  #
  # e2e/editor-semantic.spec.ts is the sixth. LSP semantic tokens fail by looking
  # like nothing happened: Monaco standalone has semantic highlighting off unless
  # an editor option turns it on, a provider can be registered and simply never
  # asked, and tokens resolved against a theme rule that does not exist repaint
  # with the DEFAULT foreground - which is what unstyled text already looks like.
  # The only assertion that separates those from success is the colour a browser
  # computed for a span, so it belongs here rather than in jsdom.
  #
  # e2e/editor-completion.spec.ts is the seventh, and the same argument applies
  # one level up. Monaco reads a completion provider's `triggerCharacters` ONCE,
  # at registration, and they only exist in the server's `initialize` reply - so a
  # provider registered a moment too early never fires on `.` and is
  # indistinguishable from code nobody wired up. LSP's `CompletionItemKind` and
  # Monaco's are different enums, so a cast renders a full, plausible widget with
  # the wrong icon on every row. And `isIncomplete: true` means the client must
  # re-ask: a client that filtered its previous list instead would still show a
  # populated widget, just missing the item the reader was typing towards. All
  # three are silent, and only a real browser can be asked what it rendered.
  #
  # e2e/editor-lsp-surface.spec.ts is the eighth: diagnostics, hover, find all
  # references and peek definition, all of which fail by showing NOTHING. LSP
  # numbers its severities 1..4 down in urgency and Monaco's MarkerSeverity is a
  # bitmask counting up, so a cast type-checks and turns every error into a hint -
  # which draws no squiggle at all, on a file that has genuine errors in it. And
  # monaco 0.56's standalone `createModelReference` resolves a preview model by
  # SYNCHRONOUS lookup and rejects when there is none, so a peek widget opens
  # with a blank preview pane for every target outside the current file - a
  # perfectly plausible widget, proving nothing. Only a browser can be asked
  # whether a squiggle was painted and whether the peek pane has source in it.
  #
  # e2e/search-perf.spec.ts is the ninth, and it is files-perf's argument applied
  # to the rail's third mode. "self" on a real 6,940-file iOS project matches
  # 12,847 times; the server caps the payload at 2,000 matches over 500 files, so
  # 2,500 rows is the worst list ⌘⇧F can ever hand the panel. Rendered eagerly
  # that is the same shape that measured 91,295 nodes on the tree, and jsdom
  # cannot tell a windowed list from a whole one because it renders both to the
  # same markup and neither to a screen. Node COUNTS again, never timings.
  #
  # e2e/terminal-links.spec.ts is the tenth, and it guards the one surface in the
  # app that a unit test cannot even approach. xterm resolves a pointer to a
  # buffer cell through its MEASURED cell box, and jsdom measures every element as
  # 0x0, so no click ever hit-tests onto a link and nothing is ever hovered - the
  # terminal's clickables have therefore never had a test at all, and they have now
  # broken twice (#57 was the first). The failure is silent by construction: the
  # link still renders, still underlines under the pointer, and the click does
  # nothing. It also depends on TIME - xterm 5.5 drops a click whose press and
  # release straddle a repaint of the link's own line - so only a real browser
  # holding a real button down for as long as a hand does can tell live from dead.
  #
  # e2e/pinch-dots.spec.ts is the eleventh, and it is here for what a pixel is
  # ON. The Device tab's pinch draws its two contacts over whatever the app being
  # driven is showing - a white article one moment and a dark chart the next - so
  # they carry their own contrast rather than the theme's. jsdom will happily
  # agree that a dot which is invisible on white is present, sized and correctly
  # positioned, because "can a person see this against that" is a question about
  # paint. The gallery puts both grounds side by side in both themes.
  #
  # Scoped to these specs on purpose, and NAMED rather than globbed. The rest of
  # frontend/e2e/ still targets the `api-gateway` demo fixtures that 2cb20c23e
  # replaced with `ao-demo`, so those six specs have been dead since — never
  # noticed, because no workflow has ever run Playwright. Repairing them is its own
  # task; widen this to the folder once it is done.
  glyph-legibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Measure the status glyphs, the sidebar qa pip, the editor, the Files rail, the terminal's links and the pinch dots in a real browser
        run: >-
          npx playwright test e2e/status-glyph.spec.ts e2e/sidebar-qa-pip.spec.ts
          e2e/editor.spec.ts e2e/editor-save.spec.ts e2e/editor-semantic.spec.ts
          e2e/editor-completion.spec.ts e2e/editor-lsp-surface.spec.ts e2e/files-perf.spec.ts
          e2e/files-state.spec.ts e2e/search-perf.spec.ts e2e/terminal-links.spec.ts
          e2e/pinch-dots.spec.ts
