name: Release latest guard

# Guard against accidental non-stable GitHub releases taking over
# /releases/latest and breaking electron-updater's stable channel.
on:
  release:
    types: [published, edited, released]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  latest-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # --include keeps the HTTP status, so the guard can tell "no stable
          # release published yet" (404, expected while only nightlies exist)
          # apart from auth/rate-limit/server faults, which must still fail.
          # gh exits non-zero on 404, hence the guarded call; a transport
          # failure prints no status line and the helper rejects it.
          response="$(gh api --include "repos/$REPO/releases/latest" || true)"
          printf '%s' "$response" | node frontend/scripts/release-latest-guard.mjs
