            is linear-time and cannot backtrack catastrophically). A pattern that
            does not compile answers with invalidRegex rather than an error.
          type: boolean
      - description: Comma-separated globs a path must match. A pattern with no slash
          matches any path SEGMENT ("*.swift" by basename, "Pods" as a directory);
          one with a slash matches the whole workspace-relative path and everything
          beneath it, with ** crossing separators.
