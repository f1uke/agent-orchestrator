components:
  schemas:
    APIError:
      properties:
        code:
          type: string
        details:
          additionalProperties: {}
          type: object
        error:
          type: string
        message:
          type: string
        requestId:
          type: string
      required:
      - error
      - code
      - message
      type: object
    AcquireSimHoldInput:
      properties:
        durationMs:
          description: Swipe duration in milliseconds.
          type: integer
        holdSeconds:
          description: 'How long the gesture may hold the device, in seconds (1-60).
            Omit for the 30 second default. This is not a working window: it only
            bounds how long a command killed mid-gesture keeps the device.'
          type: integer
        id:
          description: 'tap: the element''s accessibility identifier, the other way
            a by-name tap may target it.'
          type: string
        kind:
          description: tap, swipe, type, button, drag-begin, drag-move or drag-end
            - the gesture this hold covers.
          type: string
        label:
          description: 'tap: the element label this hold''s gesture is about to tap,
            when acquired for a by-name tap.'
          type: string
        name:
          description: 'button: home or app-switcher.'
          type: string
        text:
          description: The text a type gesture sends.
          type: string
        toX:
          description: Where a swipe or drag ends.
          format: double
          type: number
        toY:
          format: double
          type: number
        x:
          description: Normalized 0..1 screen coordinates, for tap/swipe/drag.
          format: double
          type: number
        "y":
          format: double
          type: number
      type: object
    AcquireSimLeaseInput:
      properties:
        takeOver:
          description: Claim the device even if another session holds it. Refused
            while a gesture is in flight.
          type: boolean
        ttlSeconds:
          description: How long to hold it, in seconds. Omit for the 10 minute default;
            the caller may hold for as little as a second (one gesture) and at most
            an hour.
          type: integer
        udid:
          description: Simulator udid to claim (case-insensitive).
          type: string
      required:
      - udid
      type: object
    ActivityDetail:
      properties:
        kind:
          description: What the detail reports.
          enum:
          - tool_start
          - tool_end
          - tool_failed
          - message
          type: string
        target:
          description: Curated target noun (file base name, pattern, URL host).
          type: string
        text:
          description: Curated one-line description of the action.
          type: string
        tool:
          description: Whitelisted tool name; empty for a tool AO does not curate.
          type: string
      required:
      - kind
      type: object
    ActivityEvent:
      properties:
        at:
          description: Daemon clock, UTC. The consumer runs on the same host over
            loopback.
          format: date-time
          type: string
        coarse:
          enum:
          - working
          - waiting
          - idle
          - exited
          type: string
        coarseTtlMs:
          description: Milliseconds after 'at' that 'coarse' stays true. 0 means sticky
            (never decays).
          format: int64
          type: integer
        kind:
          enum:
          - tool_start
          - tool_end
          - tool_failed
          - activity
          - message
          type: string
        sessionId:
          type: string
        target:
          type: string
        text:
          type: string
        tool:
          type: string
        ttlMs:
          description: Milliseconds after 'at' that the detail may be shown as currently
            true. 0 means no detail.
          format: int64
          type: integer
      required:
      - sessionId
      - kind
      - at
      - ttlMs
      - coarseTtlMs
      type: object
    AddProjectInput:
      properties:
        asWorkspace:
          type: boolean
        config:
          $ref: '#/components/schemas/ProjectConfig'
        name:
          type:
          - "null"
          - string
        path:
          type: string
        projectId:
          type:
          - "null"
          - string
      required:
      - path
      type: object
    AdfAttrs:
      properties:
        color:
          type: string
        filename:
          type: string
        language:
          type: string
        layout:
          type: string
        level:
          type: integer
        panelType:
          type: string
        state:
          type: string
        text:
          type: string
        url:
          type: string
      type: object
    AdfMark:
      properties:
        href:
          type: string
        type:
          type: string
      required:
      - type
      type: object
    AdfNode:
      properties:
        attrs:
          $ref: '#/components/schemas/AdfAttrs'
        content:
          items:
            $ref: '#/components/schemas/AdfNode'
          type: array
        marks:
          items:
            $ref: '#/components/schemas/AdfMark'
          type: array
        text:
          type: string
        type:
          type: string
      required:
      - type
      type: object
    AgentConfig:
      properties:
        model:
          type: string
        permissions:
          type: string
      type: object
    AgentInfo:
      properties:
        authStatus:
          description: Advisory local auth probe result. authorized means a recent
            local probe passed; spawn remains the authoritative validation point.
          enum:
          - authorized
          - unauthorized
          - unknown
          type: string
        id:
          type: string
        label:
          type: string
        models:
          description: Selectable model tiers for this agent. Empty means no tier
            choice; the agent's default model is used.
          items:
            $ref: '#/components/schemas/ModelInfo'
          type: array
        modelsOpenEnded:
          description: True when the agent's model is a free-form id (Models are examples,
            not an exhaustive list); the UI offers a typeable combobox. False means
            fixed tiers only.
          type: boolean
      required:
      - id
      - label
      type: object
    ApprovalRule:
      properties:
        enabled:
          type: boolean
        threshold:
          type: integer
      type: object
    AutoNudgeSettingsResponse:
      properties:
        enabled:
          type: boolean
      required:
      - enabled
      type: object
    ChangedFileDTO:
      properties:
        additions:
          type: integer
        binary:
          type: boolean
        committed:
          type: boolean
        deletions:
          type: integer
        entryCount:
          type: integer
        kind:
          type: string
        oldPath:
          type: string
        path:
          type: string
        status:
          type: string
      required:
      - path
      - status
      - additions
      - deletions
      - binary
      - committed
      - kind
      type: object
    ChildBriefResponse:
      properties:
        brief:
          description: Standing context for the subagent, delivered as SubagentStart
            additionalContext.
          type: string
        known:
          description: False when the subagent is not a child worktree of this worker.
          type: boolean
      required:
      - known
      type: object
    ChildNotesResponse:
      properties:
        notes:
          description: What the worker has not yet been told about its children, oldest
            first.
          items:
            type: string
          type: array
      required:
      - notes
      type: object
    ChildResponse:
      properties:
        child:
          $ref: '#/components/schemas/SessionChild'
      required:
      - child
      type: object
    ClaimPRRequest:
      properties:
        allowTakeover:
          type:
          - "null"
          - boolean
        pr:
          minLength: 1
          type: string
      required:
      - pr
      type: object
    ClaimPRResponse:
      properties:
        branchChanged:
          type: boolean
        ok:
          type: boolean
        prs:
          items:
            $ref: '#/components/schemas/SessionPRFacts'
          type: array
        sessionId:
          type: string
        takenOverFrom:
          items:
            type: string
          type: array
      required:
      - ok
      - sessionId
      - prs
      - branchChanged
      - takenOverFrom
      type: object
