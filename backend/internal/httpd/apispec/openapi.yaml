openapi: 3.1.0
info:
  description: Loopback-only HTTP surface served by the Go daemon. Generated from
    Go (code-first) — do not edit by hand; run `go generate ./...`.
  title: Agent Orchestrator HTTP daemon
  version: 0.1.0-route-shell
servers:
- description: Local daemon (loopback only)
  url: http://127.0.0.1:3001
paths:
  /api/v1/activity/stream:
    get:
      operationId: streamActivity
      parameters:
      - description: Optional session id filter. Omit to receive every session, which
          is what a desktop overlay wants.
        in: query
        name: sessionId
        schema:
          description: Optional session id filter. Omit to receive every session,
            which is what a desktop overlay wants.
          type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ActivityEvent'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Stream curated per-session agent activity
      tags:
      - activity
  /api/v1/agents:
    get:
      operationId: listAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Return cached supported and locally installed agent adapters
      tags:
      - agents
  /api/v1/agents/{agent}/probe:
    post:
      operationId: probeAgent
      parameters:
      - description: Agent adapter identifier.
        in: path
        name: agent
        required: true
        schema:
          description: Agent adapter identifier.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeAgentResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Run a fresh local readiness probe for one agent adapter
      tags:
      - agents
  /api/v1/agents/refresh:
    post:
      operationId: refreshAgents
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAgentsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Refresh the cached local agent adapter catalog
      tags:
      - agents
  /api/v1/daemon/loops:
    get:
      operationId: listDaemonLoops
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControllersListDaemonLoopsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: List the daemon's fixed-interval background loops with timing
      tags:
      - daemon
  /api/v1/events:
    get:
      operationId: streamEvents
      parameters:
      - description: Replay events with seq greater than this cursor. When omitted,
          clients may send Last-Event-ID instead.
        in: query
        name: after
        schema:
          description: Replay events with seq greater than this cursor. When omitted,
            clients may send Last-Event-ID instead.
          minimum: 0
          type:
          - "null"
          - integer
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Stream CDC events with durable replay
      tags:
      - events
  /api/v1/import:
    get:
      operationId: getImportStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportStatusResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Check whether a legacy AO install is available to import
      tags:
      - import
    post:
      operationId: runImport
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportRunResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Run the legacy AO project import through the daemon store
      tags:
      - import
  /api/v1/jira/issue:
    get:
      operationId: getJiraIssue
      parameters:
      - description: The issue key to read (e.g. PROJ-123).
        in: query
        name: key
        schema:
          description: The issue key to read (e.g. PROJ-123).
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraIssueResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Read one Jira issue's full display projection by key (pre-session detail
        view)
      tags:
      - jira
  /api/v1/jira/issue/move:
    post:
      operationId: moveJiraIssue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JiraIssueMoveRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraMoveResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Apply a status transition to any Jira issue by key — the one sanctioned
        write
      tags:
      - jira
  /api/v1/jira/issue/transitions:
    get:
      operationId: listJiraIssueTransitions
      parameters:
      - description: The issue key to read (e.g. PROJ-123).
        in: query
        name: key
        schema:
          description: The issue key to read (e.g. PROJ-123).
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraTransitionsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: List any Jira issue's available status transitions by key (read live)
      tags:
      - jira
  /api/v1/jira/myself:
    get:
      operationId: getJiraMyself
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraMyselfResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Resolve the authenticated Jira account (accountId) so Browse Jira can
        highlight the viewer's rows
      tags:
      - jira
  /api/v1/jira/projects:
    get:
      operationId: listJiraProjects
      parameters:
      - description: Optional filter matched against project key/name.
        in: query
        name: q
        schema:
          description: Optional filter matched against project key/name.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraProjectsResponse'
          description: OK
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: List the user's Jira projects for the project picker
      tags:
      - jira
  /api/v1/jira/search:
    get:
      operationId: searchJira
      parameters:
      - description: Free-text query, or an exact issue key (e.g. PROJ-123).
        in: query
        name: q
        schema:
          description: Free-text query, or an exact issue key (e.g. PROJ-123).
          type: string
      - description: Optional project key to scope the search to.
        in: query
        name: project
        schema:
          description: Optional project key to scope the search to.
          type: string
      - description: Optional assignee accountId to filter by, or 'unassigned' for
          issues with no assignee.
        in: query
        name: assignee
        schema:
          description: Optional assignee accountId to filter by, or 'unassigned' for
            issues with no assignee.
          type: string
      - description: Optional comma-separated issue-type names to filter by (e.g.
          Story,Bug). Empty matches all types.
        in: query
        name: type
        schema:
          description: Optional comma-separated issue-type names to filter by (e.g.
            Story,Bug). Empty matches all types.
          type: string
      - description: When true, exclude done issues (statusCategory != Done).
        in: query
        name: hideDone
        schema:
          description: When true, exclude done issues (statusCategory != Done).
          type: boolean
      - description: When true, only issues in an open sprint (sprint in openSprints()).
        in: query
        name: activeSprint
        schema:
          description: When true, only issues in an open sprint (sprint in openSprints()).
          type: boolean
      - description: Raw advanced JQL. When set, it drives the search verbatim and
          the structured filters above are ignored.
        in: query
        name: jql
        schema:
          description: Raw advanced JQL. When set, it drives the search verbatim and
            the structured filters above are ignored.
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JiraSearchResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Internal Server Error
        "501":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Not Implemented
      summary: Search Jira issues cross-project (free-text or exact key), read live
        via REST
      tags:
      - jira
  /api/v1/learning/collect:
